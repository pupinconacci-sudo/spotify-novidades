<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify · Meu Mês</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --green:#1DB954; --black:#0a0a0a; --surface:#111; --surface2:#1a1a1a; --border:rgba(255,255,255,0.07); --text:#f0f0ee; --muted:#888; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Syne',sans-serif; background:var(--black); color:var(--text); min-height:100vh; }
  .container { max-width:900px; margin:0 auto; padding:48px 24px 80px; }
  .mono { font-family:'DM Mono',monospace; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:32px; flex-wrap:wrap; }
  .top h1 { font-size:22px; font-weight:800; }
  .top a { color:var(--muted); font-size:12px; text-decoration:none; } .top a:hover { color:var(--green); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px 28px; margin-bottom:24px; }
  .hint { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); line-height:1.8; }
  .hint a { color:var(--green); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .btn { padding:11px 22px; border-radius:100px; font-family:'Syne',sans-serif; font-size:13px; font-weight:700; cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--text); }
  .btn-green { background:var(--green); color:#000; border-color:var(--green); }

  #wrap { display:none; justify-content:center; }
  .capsule { width:min(440px,100%); background:#212121; border-radius:18px; overflow:hidden; box-shadow:0 20px 60px #000a; }
  .photo { height:300px; background:linear-gradient(135deg,#1DB954,#0d3b1f) center/cover no-repeat; filter:grayscale(1); }
  .body { padding:26px 28px 34px; }
  .brand { display:flex; justify-content:space-between; align-items:center; font-size:13px; }
  .brand b { display:flex; align-items:center; gap:7px; font-size:15px; }
  .brand svg { width:22px; height:22px; fill:#fff; }
  .capsule h2 { font-size:34px; font-weight:800; line-height:1.08; letter-spacing:-1px; margin:26px 0 22px; }
  .lists { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .lists h3 { font-size:16px; font-weight:800; margin-bottom:6px; }
  .lists ol { list-style:none; } .lists li { font-size:15px; line-height:1.55; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @media (max-width:480px) { .capsule h2 { font-size:28px; } .lists li { font-size:13px; } }
</style>
</head>
<body>
<div class="container">
  <div class="top"><h1>Meu Mês no Spotify</h1><a href="./index.html">← Novidades da Semana</a></div>

  <div class="card" id="login" style="display:none">
    <p class="hint">Entre com o Spotify na página principal e volte aqui pelo botão "Meu mês".</p>
    <div class="row"><a class="btn btn-green" href="./index.html" style="text-decoration:none">Entrar</a></div>
  </div>

  <div id="wrap">
    <div class="capsule">
      <div class="photo" id="photo"></div>
      <div class="body">
        <div class="brand"><b><svg viewBox="0 0 24 24"><path d="M12 0a12 12 0 100 24 12 12 0 000-24zm5.5 17.3a.75.75 0 01-1 .25c-2.8-1.7-6.4-2.1-10.6-1.1a.75.75 0 11-.33-1.46c4.6-1.05 8.5-.6 11.7 1.3.36.22.47.68.25 1.01zm1.47-3.27a.94.94 0 01-1.29.31c-3.2-1.97-8.1-2.54-11.9-1.39a.94.94 0 11-.54-1.8c4.3-1.31 9.7-.67 13.4 1.6.44.27.58.85.31 1.28zm.13-3.4C15.3 8.3 8.9 8.1 5.2 9.2a1.12 1.12 0 11-.65-2.15c4.25-1.29 11.3-1.04 15.7 1.6a1.12 1.12 0 01-1.15 1.93z"/></svg>Spotify</b><span id="date"></span></div>
        <h2 id="title"></h2>
        <div class="lists">
          <div><h3>Top artistas</h3><ol id="artists"></ol></div>
          <div><h3>Top músicas</h3><ol id="tracks"></ol></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $ = id => document.getElementById(id);

// Spotify's API has no minutes-listened; short_term ≈ last 4 weeks is the closest to "this month".
async function load(){
  const tok = sessionStorage.getItem('sp_tok');
  if (!tok || Date.now() > +sessionStorage.getItem('sp_exp')) { $('login').style.display = ''; return; } // login lives on the main page
  const api = path => fetch('https://api.spotify.com/v1/me/top/' + path + '?limit=10&time_range=short_term', { headers:{ Authorization:'Bearer ' + tok } })
    .then(r => r.ok ? r.json() : Promise.reject(r.status));
  try {
    const [a, t] = await Promise.all([api('artists'), api('tracks')]);
    const mes = new Date().toLocaleDateString('pt-BR', { month:'long' });
    $('title').textContent = `Meu Sound Capsule de ${mes[0].toUpperCase() + mes.slice(1)}`;
    $('date').textContent = new Date().toLocaleDateString('pt-BR', { day:'numeric', month:'long', year:'numeric' });
    $('artists').innerHTML = a.items.map((x,i) => `<li>${i+1} ${esc(x.name)}</li>`).join('');
    $('tracks').innerHTML = t.items.map((x,i) => `<li title="${esc(x.artists.map(y => y.name).join(', '))}">${i+1} ${esc(x.name)}</li>`).join('');
    const photo = a.items[0]?.images?.[0]?.url;
    if (photo) $('photo').style.backgroundImage = `url("${esc(photo)}")`;
    $('wrap').style.display = 'flex';
  } catch (s) { $('login').style.display = ''; alert('Erro na API do Spotify (' + s + '). Faça login de novo.'); }
}
load();
</script>
</body>
</html>
